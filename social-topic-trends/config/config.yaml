# Central configuration (plan section 24). Every script reads this file;
# experiments override single keys from the command line.

paths:
  raw: hdfs:///social/raw/youtube_news/youtube_news_videos_clean.csv
  clean_volume: hdfs:///social/youtube_news/clean/volume
  clean_model: hdfs:///social/youtube_news/clean/model
  sample: hdfs:///social/youtube_news/sample_20
  features: hdfs:///social/youtube_news/features
  models: hdfs:///social/youtube_news/models
  assignments: hdfs:///social/youtube_news/gold/assignments
  reports_local: /app/reports/youtube_news
  models_local: /app/models/youtube_news
  registry: /app/experiments/youtube_news/experiment_results.csv
  fasttext_model: /opt/models/lid.176.ftz

dataset:
  name: YouTube Vietnamese news video titles
  start: "2023-01-01 00:00:00"
  end: "2026-10-30 00:00:00"

spark:
  shuffle_partitions: 32

data:
  sample_fraction: 0.2
  seed: 42

preprocessing:
  language: vi
  min_lang_confidence: 0.5
  min_tokens: 3
  use_bigram: false
  bigram_min_df: 20
  use_domain_stopwords: true

features:
  vocab_size: 20000
  min_df: 5

kmeans:
  k: 10
  max_iter: 30
  seed: 42

word2vec:
  vector_size: 100
  min_count: 5
  window: 5
  max_iter: 3
  partitions: 8
  seed: 42

bisecting_kmeans:
  k: 10
  max_iter: 30
  seed: 42

lda:
  k: 10
  max_iter: 30
  optimizer: online
  vocab_size: 10000
  seed: 42

evaluation:
  coherence_top_n: 10
  heldout_fraction: 0.1
  silhouette_sample: 200000

trend:
  # Daily publication bins in Vietnam time, compared with the previous week.
  primary_model: w2v_kmeans
  bin_minutes: 1440
  rolling_window_bins: 7
  min_periods: 3
  burst_zscore_threshold: 2.5
  std_floor_ratio: 0.1
  burst_min_volume: 20
  burst_min_lift: 1.2        # and >= 1.2x the baseline share (z alone flags +5% rises)
  merge_gap_bins: 2
  gap_volume_ratio: 0.2
  gap_window_bins: 7

mongo:
  database: youtube_news_topics

dashboard:
  representative_posts_per_topic: 15
  top_keywords: 15
  top_hashtags_per_bin: 15
